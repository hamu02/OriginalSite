<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js" defer></script>
  <title>MENU|KISSA official website</title>
  <meta name="description" content="カフェ「KISSA」のメニューを掲載しています。こだわりの浅煎りコーヒーをはじめ、さまざまなメニューをご用意しています。">
  <meta name="viewport" content="width=device-width">
  <script src="./js/moon.js" defer></script>
  <script src="./js/common.js" defer></script>
  <script src="./js/toggle-menu.js"></script>
  <script src="./js/template.js" defer></script>
  <link href="./css/common.css" rel="stylesheet">
  <link href="./css/menu.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <script src="./js/special-effects.js" defer></script>
</head>

<body>

  <!-- headerここから -->
<!-- 修正後 -->
  <header class="header"></header>
  <!-- headerここまで -->

  <!-- mainここから -->
  <main class="main">
    <div class="title">
      <h1 style="font-family: 'Cinzel', serif;">STARS</h1>
      <p>星の図鑑</p>
    </div>
    <div class="filter-area" style="text-align: center; margin-bottom: 30px;">
      <input type="text" id="searchInput" placeholder="星の名前で検索..." style="padding: 8px; width: 200px;">
      <button id="searchBtn" style="padding: 8px 16px;">検索</button>
      
      <div class="tag-buttons" style="margin-top: 15px; display: flex; justify-content: center; gap: 10px;">
        <button class="tag-btn" data-category="">すべて</button>
        <button class="tag-btn" data-category="zodiac">12星座</button>
        <button class="tag-btn" data-category="extra">変わり種天体</button>
      </div>
    </div>
    <ul class="item-list" id="starContainer">
    </ul>
     <template id="template_stars">
      <li class="star-card">
        <a href="" class="item-link">
          <img src="" alt="" class="item-img" style="width:100%; height:200px; object-fit:cover;">
          <div class="item-content">
            <span class="item-category" style="font-size: 12px; background: #eee; padding: 2px 8px;"></span>
            <dl>
              <dt class="item-name" style="font-weight: bold; margin-top: 10px;"></dt>
              <dd class="item-summary" style="font-size: 14px; margin-top: 5px;"></dd>
            </dl>
          </div>
        </a>
      </li>
    </template>
  </main>
  <!-- mainここまで -->

  <!-- footerここから -->
  <!-- 今までずらっと書いていた中身を消して、これだけにする！ -->
  <footer class="footer">
    <small>&copy; 2026 星と月の雑学図鑑 All Rights Reserved.</small>
  </footer>

  <script src="./js/search.js"></script>

</html>
